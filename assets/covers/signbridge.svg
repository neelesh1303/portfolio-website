  </marker>
  <marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M1 1 L9 5 L1 9" fill="none" stroke="#b0532c" stroke-width="1.8" stroke-linecap="round"/>
  </marker>
</defs>
